name: iOS TestFlight

# Builds the Godot iOS export on a cloud Mac, archives it with automatic
# signing (App Store Connect API key), and uploads the build to TestFlight.
# MANUAL TRIGGER ONLY (workflow_dispatch): every run consumes paid macOS
# minutes, and studio rule (Eric, 2026-11-17) is that a build runs only
# with his specific approval for that build. Do NOT add a push trigger.
#
# This repo is PUBLIC and holds no game source (see README.md). The
# Godot project arrives as a tarball downloaded from Google Drive
# (repo variable PROJECT_TARBALL_URL), mirroring the ark-pals repo:
#   curl -L -o project.tar.gz "${{ vars.PROJECT_TARBALL_URL }}"
#   mkdir project && tar -xzf project.tar.gz -C project --strip-components=1
# All build steps then run inside project/.

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"
  TEAM_ID: "YZY5R75XTP"
  ASC_KEY_ID: "MYMD552YY5"
  ASC_ISSUER_ID: "e56ffda2-e73e-4fa9-b1e3-ba89afb9f9c9"
  PROFILE_NAME: "Songlands App Store CI"
  PROFILE_UUID: "b6d2f1ac-385b-41ad-8d67-597b6e6b9ea7"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: project
    steps:
      - name: Download the Songlands project tarball
        working-directory: ${{ github.workspace }}
        run: |
          curl -fL -o project.tar.gz "${{ vars.PROJECT_TARBALL_URL }}"
          mkdir project && tar -xzf project.tar.gz -C project --strip-components=1
          ls project | head

      - name: Install Godot + export templates
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TPL_DIR"
          cp -R templates/* "$TPL_DIR/"
          echo "GODOT=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" --version

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/asc"
          echo "$ASC_API_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          cp "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install signing identity and profile
        env:
          CERT_P12_BASE64: ${{ secrets.DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Manual distribution signing (The Lost Coin's proven
          # pattern, 2026-11-20): automatic signing cannot work on a
          # CI runner — it needs a development profile, and the team
          # has no registered devices to generate one from. The
          # distribution certificate (.p12) and this app's App Store
          # profile were created via the ASC API and live only as
          # repo secrets. Fail LOUDLY if any is missing.
          for v in CERT_P12_BASE64 CERT_PASSWORD PROFILE_BASE64; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: required signing secret $v is empty or unset" >&2
              exit 1
            fi
          done
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" -o "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID_FROM_FILE="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          echo "Profile in secret: $PROFILE_UUID_FROM_FILE (expected $PROFILE_UUID)"
          if [ "$PROFILE_UUID_FROM_FILE" != "$PROFILE_UUID" ]; then
            echo "ERROR: profile UUID $PROFILE_UUID_FROM_FILE does not match the ASC API record $PROFILE_UUID" >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/songlands-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/identities.txt"
          grep -q "Apple Distribution" "$RUNNER_TEMP/identities.txt" || {
            echo "ERROR: no Apple Distribution identity in the signing keychain" >&2
            exit 1
          }

      - name: Godot iOS export
        run: |
          set -euo pipefail
          mkdir -p ios_out
          "$GODOT" --headless --path . --import
          # The preset sets application/export_project_only=true, so
          # Godot generates the Xcode project and skips its own
          # archive (which cannot sign on a CI runner). The Archive
          # step below does the real, manually signed build.
          "$GODOT" --headless --path . --export-release "iOS" ios_out/Songlands.xcodeproj
          test -d ios_out/Songlands.xcodeproj
          ls -la ios_out

      - name: Archive (manual signing with the App Store profile)
        run: |
          set -euo pipefail
          # Manual-signing overrides supersede the generated project's
          # Automatic / "Apple Development" pair. No
          # -allowProvisioningUpdates: under manual signing there is
          # nothing to provision — the profile is already installed —
          # and the flag is what sent earlier runs down the
          # development-profile path. The API-key flags stay for
          # authentication only.
          xcodebuild \
            -project ios_out/Songlands.xcodeproj \
            -scheme Songlands \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Songlands.xcarchive" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export the IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.eventideapps.songlands</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Songlands.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload to App Store Connect (TestFlight)
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the IPA as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songlands-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: ignore
